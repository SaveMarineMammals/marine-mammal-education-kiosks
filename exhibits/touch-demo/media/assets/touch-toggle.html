<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
<title>Touch toggle</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0A2A3A;
    color: #e8f4f8;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  .wrap {
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
  }
  button {
    appearance: none;
    border: 3px solid #4db8d9;
    background: #163d4d;
    color: #e8f4f8;
    font-size: 28px;
    font-weight: 700;
    min-height: 64px;
    border-radius: 10px;
    padding: 10px 18px;
    width: 100%;
  }
  button:active { background: #1f5468; }
  #label {
    display: none;
    font-size: 22px;
    font-weight: 650;
    text-align: center;
    background: #3dcc8c;
    color: #062016;
    border-radius: 8px;
    padding: 10px 12px;
  }
  #label.on { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <button type="button" id="btn">Show info</button>
  <div id="label">Touch works — info label is on</div>
</div>
<script>
(function () {
  var btn = document.getElementById("btn");
  var label = document.getElementById("label");
  var on = false;
  function toggle(e) {
    if (e) e.preventDefault();
    on = !on;
    label.classList.toggle("on", on);
    btn.textContent = on ? "Hide info" : "Show info";
  }
  btn.addEventListener("click", toggle);
})();
</script>
</body>
</html>
