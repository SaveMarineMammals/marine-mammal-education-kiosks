# Widget timeline script — Touch Hardware Demo
# Text-only Glance & Match shell plus a large Show info / Hide info HTZ button.
# No image assets — native text always paints even if the HTML package fails.
# Copy is plain text only (no Markdown, no emoji) — Xibo text widgets escape HTML.

layoutId: touch-demo-glance-and-match
template: glance-and-match
durationSeconds: 24
layoutHoldSeconds: 3600
loop: true
resolution: { width: 1920, height: 1080 }

regions:
  insights-bg:
    widgets:
      - id: panel-label
        type: text
        startSeconds: 0
        durationSeconds: 24
        transitionIn: none
        transitionOut: none
        effect: none
        copy: |
          Touch Hardware Demo

          Ops panel check
          Text layout only
          No image assets

  hero-bg:
    widgets:
      - id: hero-wash-label
        type: text
        startSeconds: 0
        durationSeconds: 24
        transitionIn: none
        transitionOut: none
        effect: none
        copy: |
          USB touch validation

  hero-still:
    widgets:
      - id: hero-still-hint
        type: text
        startSeconds: 0
        durationSeconds: 24
        transitionIn: none
        transitionOut: none
        effect: none
        copy: |
          Button lives in the large
          box on this left pane.

          If that box is blank, the
          HTML package did not load.

  hero-labels:
    widgets:
      - id: hero-labels
        type: text
        startSeconds: 0
        durationSeconds: 24
        transitionIn: none
        transitionOut: none
        effect: none
        copy: |
          Touch Demo
          Tap Show info below

          Plain text button
          No images required

  insights-art:
    widgets:
      - id: check-header
        type: text
        startSeconds: 0
        durationSeconds: 24
        transitionIn: none
        transitionOut: none
        effect: none
        copy: |
          What to check

  insights-copy:
    widgets:
      - id: check-steps
        type: text
        startSeconds: 0
        durationSeconds: 24
        transitionIn: none
        transitionOut: none
        effect: none
        copy: |
          Steps

          - Confirm this text is on screen
          - Tap Show info on the left
          - Confirm the green label appears
          - Tap Hide info to clear it

  ticker:
    widgets:
      - id: ticker-cta
        type: text
        startSeconds: 0
        durationSeconds: 24
        transitionIn: none
        transitionOut: none
        effect: tickerScroll
        copy: |
          Touch demo: tap Show info on the left pane, then Hide info

  touch-toggle:
    # Large left-pane HTZ — CSS text button only (no image files inside the package).
    widgets:
      - id: touch-toggle
        type: html-package
        asset: touch-toggle
        startSeconds: 0
        durationSeconds: 24
        transitionIn: none
        transitionOut: none
        notes: Offline text button toggles an info label on and off.

cueSheet:
  - { t: 0, action: "text shell + large touch toggle held; no layout reload" }
  - { t: 24, action: "cycle repeats (hero/ticker/toggle held)" }
