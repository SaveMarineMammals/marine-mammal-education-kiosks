# Widget timeline script — Touch Hardware Demo
# Text-only Glance & Match shell plus a native Xibo Interactive Button.
# No HTML package / HTZ. Tap advances the touch-info playlist (Next Widget).
# Copy is plain text only (no Markdown, no emoji) — Xibo text widgets escape HTML.

layoutId: touch-demo-glance-and-match
template: glance-and-match
durationSeconds: 24
layoutHoldSeconds: 3600
loop: true
resolution: { width: 1920, height: 1080 }

regions:
  insights-bg:
    widgets:
      - id: panel-label
        type: text
        startSeconds: 0
        durationSeconds: 24
        transitionIn: none
        transitionOut: none
        effect: none
        copy: |
          Touch Hardware Demo

          Ops panel check
          Native Interactive Button
          No HTML package

  hero-bg:
    widgets:
      - id: hero-wash-label
        type: text
        startSeconds: 0
        durationSeconds: 24
        transitionIn: none
        transitionOut: none
        effect: none
        copy: |
          USB touch validation

  hero-still:
    widgets:
      - id: hero-still-hint
        type: text
        startSeconds: 0
        durationSeconds: 24
        transitionIn: none
        transitionOut: none
        effect: none
        copy: |
          Use the button on this
          left pane.

          Each tap advances the
          info label below it.

  hero-labels:
    widgets:
      - id: hero-labels
        type: text
        startSeconds: 0
        durationSeconds: 24
        transitionIn: none
        transitionOut: none
        effect: none
        copy: |
          Touch Demo
          Tap Toggle info below

          Native Xibo button
          No HTML required

  insights-art:
    widgets:
      - id: check-header
        type: text
        startSeconds: 0
        durationSeconds: 24
        transitionIn: none
        transitionOut: none
        effect: none
        copy: |
          What to check

  insights-copy:
    widgets:
      - id: check-steps
        type: text
        startSeconds: 0
        durationSeconds: 24
        transitionIn: none
        transitionOut: none
        effect: none
        copy: |
          Steps

          - Confirm this text is on screen
          - Tap Toggle info on the left
          - Confirm the info label changes
          - Tap again to advance again

  ticker:
    widgets:
      - id: ticker-cta
        type: text
        startSeconds: 0
        durationSeconds: 24
        transitionIn: none
        transitionOut: none
        effect: tickerScroll
        copy: |
          Touch demo: tap Toggle info on the left pane to advance the info label

  touch-toggle:
    widgets:
      - id: toggle-info-button
        type: interactive-button
        label: Toggle info
        startSeconds: 0
        durationSeconds: 24
        transitionIn: none
        transitionOut: none
        action:
          type: next
          trigger: touch
          targetRegion: touch-info
        notes: Native Interactive Button; Next Widget on touch-info.

  touch-info:
    # Long durations so playlist items stay put until the button advances them.
    widgets:
      - id: info-idle
        type: text
        startSeconds: 0
        durationSeconds: 3600
        transitionIn: none
        transitionOut: none
        effect: none
        copy: |
          Waiting for tap

      - id: info-on
        type: text
        startSeconds: 3600
        durationSeconds: 3600
        transitionIn: none
        transitionOut: none
        effect: none
        copy: |
          Touch works — info label is on

cueSheet:
  - { t: 0, action: "text shell + native button + info playlist held" }
  - { t: 24, action: "cycle repeats (regions held; tap advances touch-info)" }
