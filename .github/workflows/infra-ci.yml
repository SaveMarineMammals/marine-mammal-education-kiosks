name: Infrastructure Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"
      - ".github/actions/terraform/**"

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: infra-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  terraform-plan:
    name: Infrastructure Plan
    runs-on: ubuntu-latest
    if: vars.TF_INFRA_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Terraform plan
        id: tf
        uses: ./.github/actions/terraform
        env:
          TF_VAR_alert_ingest_token: ${{ secrets.MMEK_ALERT_INGEST_TOKEN }}
          TF_VAR_sent_api_key: ${{ secrets.MMEK_SENT_API_KEY }}
          TF_VAR_alert_sms_to: ${{ secrets.MMEK_ALERT_SMS_TO }}
          TF_VAR_alert_email_to: ${{ secrets.MMEK_ALERT_EMAIL_TO }}
          TF_VAR_ses_from_email: ${{ secrets.MMEK_SES_FROM_EMAIL }}
        with:
          working-directory: infra/terraform/environments/production
          command: plan
          aws-role-arn: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          state-bucket: ${{ secrets.TF_STATE_BUCKET }}
          state-key: production/terraform.tfstate
          lock-table: ${{ secrets.TF_LOCK_TABLE }}

      - name: Comment if destroys detected
        if: steps.tf.outputs.destroy_detected == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ Terraform plan for **production** infrastructure includes resource **destroys**. Review carefully before merge.'
            })

  terraform-plan-skipped:
    name: Plan skipped (TF_INFRA_ENABLED)
    runs-on: ubuntu-latest
    if: vars.TF_INFRA_ENABLED != 'true'
    steps:
      - run: echo "TF_INFRA_ENABLED is not true — infrastructure plan skipped (pass)."
