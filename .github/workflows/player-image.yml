name: Player image

# Build the golden Raspberry Pi OS arm64 kiosk image (pi-gen + stage-kiosk).
# Not a required merge check — run on demand or via player-image-v* tags.

on:
  workflow_dispatch:
    inputs:
      arexibo_version:
        description: Pin Arexibo apt version (empty = latest from xiboplayer repo)
        required: false
        type: string
        default: ""
  push:
    tags:
      - "player-image-v*"

concurrency:
  group: player-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Pi OS arm64 kiosk image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read recipe version
        id: ver
        run: |
          VERSION="$(tr -d '[:space:]' < ops/players/image/VERSION)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_name=mmek-kiosk-${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Require SSH deploy pubkey for release tags
        if: startsWith(github.ref, 'refs/tags/player-image-v')
        env:
          KIOSK_SSH_PUBKEY: ${{ secrets.KIOSK_SSH_PUBKEY }}
        run: |
          if [ -z "${KIOSK_SSH_PUBKEY}" ]; then
            echo "Repository secret KIOSK_SSH_PUBKEY is required for player-image-v* releases." >&2
            exit 1
          fi

      - name: Write optional Arexibo apt pin
        env:
          AREXIBO_VERSION: ${{ inputs.arexibo_version || '' }}
        run: |
          printf '%s\n' "${AREXIBO_VERSION}" > ops/players/image/stage-kiosk/01-arexibo/AREXIBO_VERSION

      - name: SSH hardening flags
        id: ssh
        env:
          KIOSK_SSH_PUBKEY: ${{ secrets.KIOSK_SSH_PUBKEY }}
        run: |
          if [ -n "${KIOSK_SSH_PUBKEY}" ]; then
            echo "pubkey_only=1" >> "$GITHUB_OUTPUT"
          else
            echo "pubkey_only=0" >> "$GITHUB_OUTPUT"
            echo "warning: KIOSK_SSH_PUBKEY unset; SSH password auth left enabled for soak builds." >&2
          fi

      - name: Resolve first-user password
        id: pass
        env:
          KIOSK_USER_PASSWORD: ${{ secrets.KIOSK_USER_PASSWORD }}
        run: |
          set -euo pipefail
          # pi-gen requires FIRST_USER_PASS when disable-first-boot-user-rename=1
          if [ -n "${KIOSK_USER_PASSWORD}" ]; then
            PASS="${KIOSK_USER_PASSWORD}"
            SOURCE=secret
          else
            PASS="$(openssl rand -base64 24)"
            SOURCE=ephemeral
            echo "warning: KIOSK_USER_PASSWORD unset; using ephemeral build password (prefer SSH pubkey)." >&2
          fi
          echo "::add-mask::${PASS}"
          {
            echo "password=${PASS}"
            echo "source=${SOURCE}"
          } >> "$GITHUB_OUTPUT"

      # region agent log
      - name: Debug runner disk and apt purge targets
        env:
          PASS_SOURCE: ${{ steps.pass.outputs.source }}
        run: |
          set -euo pipefail
          {
            echo "uname=$(uname -a)"
            echo "arch=$(uname -m)"
            echo "pass_source=${PASS_SOURCE}"
            df -BG / | awk 'NR==2 {print "df_root_size_g="$2" used_g="$3" avail_g="$4}'
            for pkg in google-chrome-stable google-cloud-cli-anthoscli google-cloud-cli; do
              if apt-cache show "$pkg" >/dev/null 2>&1; then
                echo "apt_cache_${pkg}=present"
              else
                echo "apt_cache_${pkg}=missing"
              fi
            done
            for url in \
              https://dl.xiboplayer.org/deb/GPG-KEY.asc \
              https://dl.xiboplayer.org/deb/debian/trixie/Packages; do
              code="$(curl -sS -o /dev/null -w '%{http_code}' -A 'MMEK-player-image/1.0' --max-time 30 "${url}" || echo err)"
              echo "xibo_probe_${url}=${code}"
            done
          } | tee /tmp/mmek-player-image-debug.txt
          ARCH="$(uname -m)"
          DF_AVAIL="$(df -BG / | awk 'NR==2 {print $4}')"
          CHROME=missing; apt-cache show google-chrome-stable >/dev/null 2>&1 && CHROME=present
          ANTHOS=missing; apt-cache show google-cloud-cli-anthoscli >/dev/null 2>&1 && ANTHOS=present
          GPG_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -A 'MMEK-player-image/1.0' --max-time 30 https://dl.xiboplayer.org/deb/GPG-KEY.asc || echo err)"
          printf '%s\n' "{\"sessionId\":\"28006a\",\"runId\":\"post-fix\",\"hypothesisId\":\"A,F,G\",\"location\":\"player-image.yml:debug-step\",\"message\":\"runner apt/disk/pass/xibo probe\",\"timestamp\":$(date +%s000),\"data\":{\"arch\":\"${ARCH}\",\"chrome\":\"${CHROME}\",\"anthoscli\":\"${ANTHOS}\",\"dfAvail\":\"${DF_AVAIL}\",\"passSource\":\"${PASS_SOURCE}\",\"gpgHttp\":\"${GPG_CODE}\"}}"
      # endregion

      - name: Prefetch Arexibo arm64 deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STAGE=ops/players/image/stage-kiosk/01-arexibo
          MANIFEST=ops/players/image/vendor/arexibo.manifest.yaml
          OUT="${STAGE}/arexibo.deb"
          PIN="$(tr -d '[:space:]' < "${STAGE}/AREXIBO_VERSION" || true)"
          VER="$(awk -F'"' '/^version:/{print $2; exit}' "${MANIFEST}")"
          EXPECT_SHA="$(awk -F'"' '/^sha256:/{print $2; exit}' "${MANIFEST}")"
          TAG="$(awk -F'"' '/^release_tag:/{print $2; exit}' "${MANIFEST}")"
          ASSET="$(awk -F'"' '/^asset_name:/{print $2; exit}' "${MANIFEST}")"
          if [[ -n "${PIN}" && "${PIN}" != "${VER}" ]]; then
            echo "AREXIBO_VERSION pin '${PIN}' does not match mirrored package '${VER}' in ${MANIFEST}." >&2
            echo "Publish a new deps-arexibo-* release asset and update the manifest." >&2
            exit 1
          fi
          echo "Downloading mirrored arexibo ${VER} from release ${TAG} (${ASSET})"
          # Upstream dl.xiboplayer.org returns Cloudflare 403 to GitHub-hosted runners.
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "${ASSET}" --dir "${STAGE}"
          mv "${STAGE}/${ASSET}" "${OUT}"
          GOT_SHA="$(sha256sum "${OUT}" | awk '{print $1}')"
          echo "sha256 expect=${EXPECT_SHA} got=${GOT_SHA}"
          [[ -n "${EXPECT_SHA}" && "${GOT_SHA}" == "${EXPECT_SHA}" ]]
          printf '%s\n' "{\"sessionId\":\"28006a\",\"runId\":\"post-fix\",\"hypothesisId\":\"G\",\"location\":\"player-image.yml:prefetch-arexibo\",\"message\":\"prefetched arexibo deb from github release mirror\",\"timestamp\":$(date +%s000),\"data\":{\"version\":\"${VER}\",\"tag\":\"${TAG}\",\"bytes\":$(wc -c < "${OUT}"),\"sha256\":\"${GOT_SHA}\"}}"

      - name: Build image (pi-gen)
        id: build
        uses: usimd/pi-gen-action@v1
        with:
          image-name: ${{ steps.ver.outputs.image_name }}
          pi-gen-version: arm64
          release: trixie
          stage-list: >-
            stage0
            stage1
            stage2
            ${{ github.workspace }}/ops/players/image/stage-kiosk
          export-last-stage-only: true
          compression: xz
          compression-level: "6"
          enable-ssh: 1
          pubkey-only-ssh: ${{ steps.ssh.outputs.pubkey_only }}
          pubkey-ssh-first-user: ${{ secrets.KIOSK_SSH_PUBKEY }}
          username: mmek
          password: ${{ steps.pass.outputs.password }}
          disable-first-boot-user-rename: 1
          hostname: kiosk-unconfigured
          locale: en_US.UTF-8
          keyboard-keymap: us
          keyboard-layout: English (US)
          timezone: America/New_York
          enable-cloud-init: 0
          # false: v1.11.0 disk cleanup apt-purges packages missing on ubuntu-24.04-arm
          increase-runner-disk-size: false
          verbose-output: true

      - name: Collect build info and checksums
        id: artifact
        run: |
          set -euo pipefail
          IMG="${{ steps.build.outputs.image-path }}"
          test -n "${IMG}" && test -e "${IMG}"
          OUT=dist-player-image
          mkdir -p "${OUT}"
          cp -a "${IMG}" "${OUT}/"
          BASE="$(basename "${IMG}")"
          {
            echo "recipe_version=${{ steps.ver.outputs.version }}"
            echo "git_sha=${GITHUB_SHA}"
            echo "git_ref=${GITHUB_REF}"
            echo "image_file=${BASE}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            echo "arexibo_version_input=${{ inputs.arexibo_version || '' }}"
          } > "${OUT}/build-info.txt"
          (
            cd "${OUT}"
            sha256sum "${BASE}" build-info.txt > sha256sums.txt
          )
          echo "dir=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Upload soak artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.image_name }}
          path: ${{ steps.artifact.outputs.dir }}/
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/player-image-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifact.outputs.dir }}/*
          generate_release_notes: true
          body: |
            Approved MMEK kiosk golden image `${{ steps.ver.outputs.image_name }}`.

            Flash the `.img.xz`, then place a generated `kiosk.conf` on `/boot/firmware/`
            (see **Kiosk config** workflow / `ops/players/image/README.md`).
