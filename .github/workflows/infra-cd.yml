name: Infra apply

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-cd.yml"
      - ".github/actions/terraform/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mmek-terraform
  cancel-in-progress: false

jobs:
  terraform-apply:
    name: Apply production DNS
    runs-on: ubuntu-latest
    if: vars.TF_INFRA_ENABLED == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Terraform apply
        uses: ./.github/actions/terraform
        env:
          # When all are set, production creates the admin-alert Lambda.
          # See ops/runbooks/sent-dm-alerts.md. Empty values → 0 Lambda resources.
          TF_VAR_alert_ingest_token: ${{ secrets.MMEK_ALERT_INGEST_TOKEN }}
          TF_VAR_sent_api_key: ${{ secrets.MMEK_SENT_API_KEY }}
          TF_VAR_alert_sms_to: ${{ secrets.MMEK_ALERT_SMS_TO }}
          TF_VAR_alert_email_to: ${{ secrets.MMEK_ALERT_EMAIL_TO }}
          TF_VAR_ses_from_email: ${{ secrets.MMEK_SES_FROM_EMAIL }}
        with:
          working-directory: infra/terraform/environments/production
          command: apply
          aws-role-arn: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          state-bucket: ${{ secrets.TF_STATE_BUCKET }}
          state-key: production/terraform.tfstate
          lock-table: ${{ secrets.TF_LOCK_TABLE }}

  terraform-apply-skipped:
    name: Apply skipped (TF_INFRA_ENABLED)
    runs-on: ubuntu-latest
    if: vars.TF_INFRA_ENABLED != 'true'
    steps:
      - run: echo "TF_INFRA_ENABLED is not true — infra apply skipped."
