name: Terraform
description: Initialize Terraform and run plan or apply for an MMEK environment.

inputs:
  working-directory:
    description: Path to the Terraform environment root
    required: true
  command:
    description: plan or apply
    required: true
  aws-role-arn:
    description: IAM role ARN to assume via OIDC
    required: true
  aws-region:
    description: AWS region
    required: false
    default: us-east-1
  state-bucket:
    description: S3 bucket for remote state
    required: true
  state-key:
    description: S3 object key for this environment state file
    required: true
  lock-table:
    description: DynamoDB table for state locking
    required: true
  var-file:
    description: Optional terraform.tfvars path relative to working-directory
    required: false
    default: terraform.tfvars

outputs:
  destroy_detected:
    description: Whether the plan includes resource deletions
    value: ${{ steps.plan.outputs.destroy_detected }}

runs:
  using: composite
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
        terraform_wrapper: false

    - name: Require AWS role and state backend inputs
      shell: bash
      env:
        AWS_ROLE_ARN: ${{ inputs.aws-role-arn }}
        STATE_BUCKET: ${{ inputs.state-bucket }}
        LOCK_TABLE: ${{ inputs.lock-table }}
      run: |
        missing=()
        [[ -n "${AWS_ROLE_ARN}" ]] || missing+=("aws-role-arn")
        [[ -n "${STATE_BUCKET}" ]] || missing+=("state-bucket")
        [[ -n "${LOCK_TABLE}" ]] || missing+=("lock-table")
        if ((${#missing[@]})); then
          echo "::error::Missing required Terraform action input(s): ${missing[*]}."
          echo "Set repository variables AWS_TERRAFORM_ROLE_ARN, TF_STATE_BUCKET, and TF_LOCK_TABLE"
          echo "(preferred; Dependabot can read vars) or the matching repository secrets."
          echo "See docs/infra-pipelines.md."
          exit 1
        fi

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Terraform init
      shell: bash
      run: |
        chmod +x infra/scripts/*.sh
        ./infra/scripts/terraform-init.sh \
          "${{ inputs.working-directory }}" \
          "${{ inputs.state-bucket }}" \
          "${{ inputs.state-key }}" \
          "${{ inputs.aws-region }}" \
          "${{ inputs.lock-table }}"

    - name: Terraform plan
      if: inputs.command == 'plan'
      id: plan
      shell: bash
      run: |
        ./infra/scripts/terraform-plan.sh \
          "${{ inputs.working-directory }}" \
          "${{ inputs.var-file }}"

    - name: Terraform apply
      if: inputs.command == 'apply'
      shell: bash
      run: |
        ./infra/scripts/terraform-apply.sh \
          "${{ inputs.working-directory }}" \
          "${{ inputs.var-file }}"
